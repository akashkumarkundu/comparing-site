services:
  - type: web
    name: compare-anything-api
    env: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: "Compare Anything"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: sqlite
      - key: AI_PROVIDER
        value: Groq
      - key: GROQ_API_KEY
        sync: false
      - key: AI_MODEL
        value: openai/gpt-oss-20b
      - key: RATE_LIMIT_PER_DAY
        value: 10
      - key: RATE_LIMIT_PER_MINUTE
        value: 30
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
